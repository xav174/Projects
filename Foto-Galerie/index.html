<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto-Galerie</title>
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/body.css">
    <link rel="stylesheet" href="styles/galery.css">
    <link rel="stylesheet" href="styles/mediaqueries.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet"> 
</head>
<body>
    <header class="header">
        <div class="scroll-watcher"></div>
        <div class="left-section">
            <p><a href="#home">LensStories</a></p>
            <div class="logo-section"></div>
        </div>

        <div class="middle-section">
            <div class="searchbar-section">
                <input class="searchbar" type="search" placeholder="Search">
                <button class="search-btn">
                    <img class="search-icon" src="assets/search.svg" alt="search-icon">
                </button>
            </div>
        </div>

        <ul class="right-section">
            <li><a href="#home">Home </a><hr></li>
            <li class="dropdown">
                <a href="#" class="dropdown-toggle">Explore </a><hr>
                <ul class="dropdown-menu">
                    <li><a href="#">Today</a></li>
                    <li><a href="#">Images</a></li>
                    <li><a href="#">Wallpapers</a></li>
                    <li><a href="#">Backgrounds</a></li>
                </ul>
            </li>
            <li><a href="#">About </a><hr></li>
            <li><a href="#">Contact </a><hr></li>
        </ul>
    </header>

    <section class="main-body">
        <div class="home-wrapper fade-animation" id="home">
            <img class="home-background-img" src="assets/home-hintergrund.jpg" alt="image">
            <div class="home-background-text">
                Willkommen bei den LensStories
            </div>
        </div>
    </section>

    <div class="galery-wrapper">
        <div class="row"> 
            <div class="column">
                <img class="fade-animation2" src="assets/picture1.jpg" alt="picture1">
                <img class="fade-animation2" src="assets/picture2.jpg" alt="picture2">
                <img class="fade-animation2" src="assets/picture3.avif" alt="picture2">
                <img class="fade-animation2" src="assets/picture10.avif" alt="picture2">
            </div>
            <div class="column">
                <img class="fade-animation2" src="assets/picture4.avif" alt="picture1">
                <img class="fade-animation2" src="assets/picture5.avif" alt="picture2">
                <img class="fade-animation2" src="assets/picture7.avif" alt="picture2">
                <img class="fade-animation2" src="assets/picture6.avif" alt="picture2">
            </div>
            <div class="column">
                <img class="fade-animation2" src="assets/picture8.avif" alt="picture1">
                <img class="fade-animation2" src="assets/picture9.avif" alt="picture2">
                <img class="fade-animation2" src="assets/picture12.avif" alt="picture2">
                <img class="fade-animation2" src="assets/picture11.avif" alt="picture2">
            </div>
            <div class="column">
                <img class="fade-animation2" src="assets/picture13.avif" alt="picture1">
                <img class="fade-animation2" src="assets/picture14.avif" alt="picture2">
                <img class="fade-animation2" src="assets/picture15.avif" alt="picture2">
                <img class="fade-animation2" src="assets/picture16.avif" alt="picture2">
            </div>
        </div>
    </div>


    <script src="main.js"></script>
</body>
</html>
