<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail</title>
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/body.css">

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <header class="header">
        <div class="left-section">
            <div class="hamburger-menu">
                <i class="fa-solid fa-bars"></i>
            </div>
            <img class="gmail-logo" src="assets/gmail-logo.png" alt="Gmail-Logo">
        </div>
        <div class="middle-section">
            <form class="search-section">
                <button class="search-btn" type="submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <input type="text" placeholder="In E-Mails suchen">
                <button class="search-option-btn">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </form>
        </div>
        <div class="right-section">
            <a href="#"><i class="fa-regular fa-circle-question"></i></a>
            <a href="#"><i class="fa-solid fa-gear"></i></a>
            <a href="#"><i class="fa-solid fa-list"></i></a>
            <a href="#" class="profile-picture">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>
    </header>




<script src="main.js"></script>
</body>
</html>
