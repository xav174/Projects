<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT E-Commerce Website</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Chivo:ital,wght@0,100..900;1,100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

</head>
<body>
    <nav id="nav" class="navbar">
        <div class="navTop">
            <div class="navItem">
                <img src="assets/logo.png" alt="" class="logo">
            </div>
            <div class="navItem">
                <h1 class="title">BUTTERFLY</h1>
            </div>
            <div class="navItem">
                <button class="contactMe">Contact</button>
            </div>
        </div>
        <div class="navBottom">
            <div class="menuItem">Timo Boll</div>
            <div class="menuItem">Fan Zhen Dong</div>
            <div class="menuItem">Ovtcharov</div>
            <div class="menuItem">Ma Long</div>
        </div>
    </nav>
    
    <div class="slider">
        <div class="sliderWrapper">
            <div class="sliderItem">
                <img src="assets/blade_boll_forte.png" alt="">
                <div class="sliderBg"></div>
                <h1 class="sliderTitle">Boll Forte III</h1>
                <h2 class="sliderPrice">59,90€</h2>
                <button class="buyBtn">BUY NOW!</button>
            </div>
            <div class="sliderItem">
                <img src="assets/blade_fan_zhen_dong_zlc.png" alt="">
                <div class="sliderBg"></div>
                <h1 class="sliderTitle">Fan Zhendong Series <br> Fan Zhendong ZLC</h1>
                <h2 class="sliderPrice">239,90€</h2>
                <button class="buyBtn">BUY NOW!</button>
            </div>
            <div class="sliderItem">
                <img src="assets/blade_ovtcharov_alc.png" alt="">
                <div class="sliderBg"></div>
                <h1 class="sliderTitle">Dimitrij Ovtcharov <br> Innerforce ALC</h1>
                <h2 class="sliderPrice">179,90€</h2>
                <button class="buyBtn">BUY NOW!</button>
            </div>
            <div class="sliderItem">
                <img src="assets/blade_boll_forte.png" alt="">
                <div class="sliderBg"></div>
                <h1 class="sliderTitle">Boll Forte III</h1>
                <h2 class="sliderPrice">59,90€</h2>
                <button class="buyBtn">BUY NOW!</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
