<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <form action="" class="form">
            <div class="form-container">
                <label for="form-name">Name:</label>
                <input type="text" id="form-name" placeholder="Type your name">
    
                <label for="form-lname">Last name:</label>
                <input type="text" id="form-lname" placeholder="Type your last name">
    
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Type your email adress">
    
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Type your password">
            </div>
            <input class="btn" type="submit" value="sign up"> 
        </form>  

        <a href="login.html">
            <button class="login-btn">login</button>
        </a>
    </div>
    <script src="main.js"></script>    
</body>
</html>
